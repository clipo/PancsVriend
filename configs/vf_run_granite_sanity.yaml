# =============================================================================
# SANITY-CHECK simulation run — generated by configs/make_sanity_configs.py;
# do not edit by hand. Differs from the _lp yaml ONLY in value_function (the
# sequentially sampled -sanity tables), llm_model (-vf-s) and runs (100).
# Read against the -vf-lp exact results, not as a result in its own right.
# =============================================================================
# VALUE-FUNCTION simulation run — granite-4.2-30b-Q8_0, R3 dual-count, all scenarios
# =============================================================================
# Composition-cell P(MOVE) lookups, no LLM server, no GPU. See
# configs/vf_run_gemma_lp.yaml for the full mechanics (artifact freezing into
# <run_dir>/value_functions/, {scenario} template semantics, profiles).
#
#   python run_llm_probability_simulation_analysis.py \
#       --config-yaml configs/vf_run_granite_lp.yaml --config-profile production
# =============================================================================

run_root: "experiments_with_llama_cpp"
run_id: null

llm_model: "granite-4.2-30b-vf-s"

manifest_file: null
skip_vf_build: true
skip_contexts: false
skip_analysis: false
skip_rank_stability: true
continue_on_error: false
dry_run: false

vf_build_args:
  config: "configs/value_function_scenarios_granite.yaml"
  plot: true

contexts_args:
  scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
  runs: 100
  max_steps: 1000
  grid_size: 20
  num_type_a: 160
  num_type_b: 160
  value_function: "value_functions/results/sampled_small/tables/vf_granite-4.2-30b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
  temperature: 0.3
  scenario_file: "scenarios_a2.py"
  llm_model: "granite-4.2-30b-vf-s"
  processes: 15        # 2026-09-07: one model at a time on the 20-core box, 5 cores left free for other work
  no_parallel: false
  new: true

analysis_args: {}

profiles:

  smoke_test:
    skip_rank_stability: true   # one scenario x 2 runs: nothing to certify (2026-09-11)
    contexts_args:
      scenarios: [baseline]
      runs: 2
      max_steps: 2
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/sampled_small/tables/vf_granite-4.2-30b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "granite-4.2-30b-vf-s"
      processes: 2
      no_parallel: false
      new: true

  production:
    contexts_args:
      scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
      runs: 100
      max_steps: 1000
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/sampled_small/tables/vf_granite-4.2-30b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "granite-4.2-30b-vf-s"
      processes: 15       # see contexts_args note
      no_parallel: false
      new: true
