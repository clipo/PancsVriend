# =============================================================================
# EXACT-table run (logprob value functions, 2026-09-05). Hand-edited SOURCE
# config since 2026-09-07: it is no longer generated from the _r3 sibling (the
# sampled -vf-r3 tables carry the batch-numerics artifact and are not a result;
# the _r3 yaml is kept only to reproduce those runs), and
# configs/make_sanity_configs.py derives the -sanity arm from this file.
# value_function points at value_functions/results/llm_logprob/…-lp…, llm_model
# is <model>-vf-lp, and rank stability runs in --exact mode (no ruler).
# VALUE-FUNCTION simulation run — Llama-3.3-70B R3 dual-count, all scenarios
# =============================================================================
# Simulations driven by the exact (logprob) value functions instead of live LLM calls:
# no llama-server, no GPU — each decision is a Bernoulli draw from the exact
# (n_similar, n_occupied) composition-cell P(MOVE) rate (the heatmap surface;
# ratio lookup removed 2026-08-25). Runs finish in minutes, seeded by run_id.
#
#   python run_llm_probability_simulation_analysis.py \
#       --config-yaml configs/vf_run_llama_lp.yaml --config-profile production
#
# The orchestrator FREEZES the resolved vf artifacts (JSON + figures + a
# composition-heatmap grid rendered from the frozen copies) into
# <run_dir>/value_functions/ and points the contexts stage at the frozen
# copies, so every run folder carries the exact decision tables it simulated
# from — side-by-side with its results.
#
# vf_build_args documents how the artifacts were sampled (and would re-run
# build_value_function.py against a live llama-server if skip_vf_build were
# false); the sampling config is frozen into the run dir either way.
#
# contexts_args.value_function is a {scenario} TEMPLATE: it pins the artifact
# label and prompt style exactly, and llm_runner substitutes each scenario.
# The mismatch guard still verifies each loaded artifact's scenario metadata.
# =============================================================================

run_root: "experiments_with_llama_cpp"
run_id: null

llm_model: "llama-3.3-70b-vf-lp"

manifest_file: null
skip_vf_build: true          # exact tables come from value_functions/logprob/logprob_value_function.py, not the sampler
skip_contexts: false
skip_analysis: false
continue_on_error: false
dry_run: false

vf_build_args:
  config: "configs/value_function_scenarios_llama.yaml"
  plot: true

contexts_args:
  scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
  runs: 10000
  max_steps: 1000
  grid_size: 20
  num_type_a: 160
  num_type_b: 160
  value_function: "value_functions/results/llm_logprob/vf_llama-3.3-70b-chat-grammar-lp__{scenario}__R3_dual_count.json"
  temperature: 0.3           # recorded in config.json; the table was extracted at 0.3
  scenario_file: "scenarios_a2.py"
  llm_model: "llama-3.3-70b-vf-lp"
  processes: 15        # 2026-09-07: one model at a time on the 20-core box, 5 cores left free for other work
  no_parallel: false
  new: true

analysis_args: {}

profiles:

  smoke_test:
    contexts_args:
      scenarios: [baseline]
      runs: 2
      max_steps: 2
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/llm_logprob/vf_llama-3.3-70b-chat-grammar-lp__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "llama-3.3-70b-vf-lp"
      processes: 2
      no_parallel: false
      new: true

  production:
    contexts_args:
      scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
      runs: 10000
      max_steps: 1000
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/llm_logprob/vf_llama-3.3-70b-chat-grammar-lp__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "llama-3.3-70b-vf-lp"
      processes: 15       # see contexts_args note
      no_parallel: false
      new: true
