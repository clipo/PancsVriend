# =============================================================================
# SANITY-CHECK sampling arm — generated by configs/make_sanity_configs.py;
# do not edit by hand. Differs from the production sampling yaml ONLY in
# concurrency (1, sequential: the batch-numerics artifact is not
# reproduced), sampling.samples (25), label (-sanity) and out_dir.
# =============================================================================
# Value-function scenario sweep — Llama-3.3-70B, ALL scenarios, R3, chat+grammar
# =============================================================================
# One vf-1 artifact per scenario (both roles each), same style and arm, so the
# cross-scenario comparison isolates the SOCIAL CONTEXT: the composition
# sentence is identical, only the identity labels differ (role_keywords pulls
# type_a/type_b from scenarios_a2.py; red = type_a, blue = type_b).
#
#   python value_functions/sampling/build_value_function.py \
#       --config configs/value_function_scenarios_gemma.yaml --plot
#
# Server first (chat template => --reasoning off for gemma):
#   /srv/shared/schelling/llama.cpp/build/bin/llama-server \
#       -m llms/gemma-4-31B-it-Q5_K_M.gguf --alias gemma-4-31b \
#       -ngl -1 -fa on -np 4 -c 8192 --host 127.0.0.1 --port 8085 \
#       --jinja --reasoning off
# =============================================================================

label: llama-3.3-70b-chat-grammar-sanity
model: Llama-3.3-70B-Instruct-Q4_K_M
llm_url: "http://localhost:8085/v1/completions"   # path rewritten per llm_style
llm_style: "chat+grammar"
temperature: 0.3
concurrency: 1          # SEQUENTIAL: do not reproduce the batch-numerics artifact
seed: 0

scenarios:
  - baseline
  - race_white_black
  - ethnic_asian_hispanic
  - income_high_low
  - political_liberal_conservative
  - green_yellow
scenario_file: scenarios_a2.py

styles: [R3_dual_count]   # user decision 2026-08-21: dual-count is THE value-function style
roles: [red, blue]

# per_composition (user decision 2026-08-21): EVERY composition gets the full
# N — 1-of-2 and 2-of-4 are separately sampled 100x each, never split — and the
# ratio datapoint pools its members (with equal per-composition N the pooled
# rate IS the average of the member rates). 45 compositions x 100 x 2 roles
# -> 9,000 requests per scenario, 54,000 total. Uniform N across scenarios
# (NO merge_from) so the CIs are comparable panel to panel.
sampling:
  mode: per_composition
  samples: 25
merge_from: []

out_dir: value_functions/results/sampled/sanity
