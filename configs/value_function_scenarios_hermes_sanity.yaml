# =============================================================================
# SANITY-CHECK sampling arm — generated by configs/make_sanity_configs.py;
# do not edit by hand. Differs from the production sampling yaml ONLY in
# concurrency (1, sequential: the batch-numerics artifact is not
# reproduced), sampling.samples (25), label (-sanity) and out_dir.
# =============================================================================
# Value-function scenario sweep — Hermes-4.3-36B-Q8_0, ALL scenarios, R3, chat+grammar
# =============================================================================
# Nous Hermes 4.3 on a ByteDance Seed-OSS base (arch seed_oss). Its chat
# template carries reasoning/think markers AND Llama-style <|start_header_id|>
# tokens despite the non-Llama base — confirm the smoke test returns bare
# MOVE/STAY before trusting a full sweep.
#
# Q8_0, not Q5 (user decision 2026-08-27): a quantisation LABEL is not a fixed
# amount of degradation — the same Q5_K_M costs a 14B dense model more than a
# 119B MoE — so the principle is to MINIMISE distortion per model rather than
# match a label. At this size Q8_0 is affordable and near-lossless.
#
#   python value_functions/sampling/build_value_function.py \
#       --config configs/value_function_scenarios_hermes.yaml --calibrate --plot
#
# Server first:
#   /srv/shared/schelling/llama.cpp/build/bin/llama-server \
#       -m llms/hermes-4_3_36b-Q8_0.gguf --alias hermes \
#       -ngl -1 -fa on -np 4 -c 8192 --host 127.0.0.1 --port 8085 \
#       --jinja --reasoning off
# =============================================================================

label: hermes-4.3-36b-chat-grammar-sanity
model: Hermes-4.3-36B-Q8_0
llm_url: "http://localhost:8085/v1/completions"   # path rewritten per llm_style
llm_style: "chat+grammar"
temperature: 0.3
concurrency: 1          # SEQUENTIAL: do not reproduce the batch-numerics artifact
seed: 0

scenarios:
  - baseline
  - race_white_black
  - ethnic_asian_hispanic
  - income_high_low
  - political_liberal_conservative
  - green_yellow
scenario_file: scenarios_a2.py

styles: [R3_dual_count]
roles: [red, blue]

# Identical budget to the existing five models — that identity is what makes
# the new models comparable to them.
sampling:
  mode: per_composition
  samples: 25
merge_from: []

out_dir: value_functions/results/sampled/sanity
