# =============================================================================
# EXACT-table run (logprob value functions, 2026-09-05). Hand-edited SOURCE
# config since 2026-09-07: it is no longer generated from the _r3 sibling (the
# sampled -vf-r3 tables carry the batch-numerics artifact and are not a result;
# the _r3 yaml is kept only to reproduce those runs), and
# configs/make_sanity_configs.py derives the -sanity arm from this file.
# value_function points at value_functions/results/llm_logprob/…-lp…, llm_model
# is <model>-vf-lp, and rank stability runs in --exact mode (no ruler).
# VALUE-FUNCTION simulation run — granite-4.2-30b-Q8_0, R3 dual-count, all scenarios
# =============================================================================
# Composition-cell P(MOVE) lookups, no LLM server, no GPU. See
# configs/vf_run_gemma_lp.yaml for the full mechanics (artifact freezing into
# <run_dir>/value_functions/, {scenario} template semantics, profiles).
#
#   python run_llm_probability_simulation_analysis.py \
#       --config-yaml configs/vf_run_granite_lp.yaml --config-profile production
# =============================================================================

run_root: "experiments_with_llama_cpp"
run_id: null

llm_model: "granite-4.2-30b-vf-lp"

manifest_file: null
skip_vf_build: true
skip_contexts: false
skip_analysis: false
continue_on_error: false
dry_run: false

vf_build_args:
  config: "configs/value_function_scenarios_granite.yaml"
  plot: true

contexts_args:
  scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
  runs: 10000
  max_steps: 1000
  grid_size: 20
  num_type_a: 160
  num_type_b: 160
  value_function: "value_functions/results/llm_logprob/tables/vf_granite-4.2-30b-chat-grammar-lp__{scenario}__R3_dual_count.json"
  temperature: 0.3
  scenario_file: "scenarios_a2.py"
  llm_model: "granite-4.2-30b-vf-lp"
  processes: 15        # 2026-09-07: one model at a time on the 20-core box, 5 cores left free for other work
  no_parallel: false
  new: true

analysis_args: {}

profiles:

  smoke_test:
    contexts_args:
      scenarios: [baseline]
      runs: 2
      max_steps: 2
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/llm_logprob/tables/vf_granite-4.2-30b-chat-grammar-lp__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "granite-4.2-30b-vf-lp"
      processes: 2
      no_parallel: false
      new: true

  production:
    contexts_args:
      scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
      runs: 10000
      max_steps: 1000
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/llm_logprob/tables/vf_granite-4.2-30b-chat-grammar-lp__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "granite-4.2-30b-vf-lp"
      processes: 15       # see contexts_args note
      no_parallel: false
      new: true
