# =============================================================================
# SANITY-CHECK simulation run — generated by configs/make_sanity_configs.py;
# do not edit by hand. Differs from the _lp yaml ONLY in value_function (the
# sequentially sampled -sanity tables), llm_model (-vf-s) and runs (10).
# Read against the -vf-lp exact results, not as a result in its own right.
# =============================================================================
# VALUE-FUNCTION simulation run — Qwen3.6-27B R3 dual-count, all scenarios
# =============================================================================
# Simulations driven by the exact (logprob) value functions instead of live LLM calls;
# see configs/vf_run_gemma_lp.yaml for the full mechanics (composition-cell
# lookup, artifact freezing into <run_dir>/value_functions/, {scenario}
# template semantics).
#
#   python run_llm_probability_simulation_analysis.py \
#       --config-yaml configs/vf_run_qwen_lp.yaml --config-profile production
#
# Sufficiency is checked by value_functions/sampling/vf_multisplit_check.py, which builds
# and simulates its own half-split arms in scratch. The production_half profile
# and the E3 check it fed were retired 2026-09-01.
# =============================================================================

run_root: "experiments_with_llama_cpp"
run_id: null

llm_model: "qwen3.6-27b-vf-s"

manifest_file: null
skip_vf_build: true
skip_contexts: false
skip_analysis: false
continue_on_error: false
dry_run: false

vf_build_args:
  config: "configs/value_function_scenarios_qwen.yaml"
  plot: true

contexts_args:
  scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
  runs: 10
  max_steps: 1000
  grid_size: 20
  num_type_a: 160
  num_type_b: 160
  value_function: "value_functions/results/sampled/sanity/vf_qwen3.6-27b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
  temperature: 0.3           # recorded in config.json; the table was extracted at 0.3
  scenario_file: "scenarios_a2.py"
  llm_model: "qwen3.6-27b-vf-s"
  processes: 15        # 2026-09-07: one model at a time on the 20-core box, 5 cores left free for other work
  no_parallel: false
  new: true

analysis_args: {}

profiles:

  smoke_test:
    contexts_args:
      scenarios: [baseline]
      runs: 2
      max_steps: 2
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/sampled/sanity/vf_qwen3.6-27b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "qwen3.6-27b-vf-s"
      processes: 2
      no_parallel: false
      new: true

  production:
    contexts_args:
      scenarios: [baseline, race_white_black, ethnic_asian_hispanic, income_high_low, political_liberal_conservative, green_yellow]
      runs: 10
      max_steps: 1000
      grid_size: 20
      num_type_a: 160
      num_type_b: 160
      value_function: "value_functions/results/sampled/sanity/vf_qwen3.6-27b-chat-grammar-sanity__{scenario}__R3_dual_count.json"
      temperature: 0.3
      scenario_file: "scenarios_a2.py"
      llm_model: "qwen3.6-27b-vf-s"
      processes: 15       # see contexts_args note
      no_parallel: false
      new: true
