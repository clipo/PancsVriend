agent_types:
- standard
- memory
experiment_parameters:
  max_steps: 1000
  runs_per_config: 30
  use_llm_probability: 1.0
grid_configurations:
  large:
    grid_size: 20
    type_a: 150
    type_b: 150
  medium:
    grid_size: 15
    type_a: 75
    type_b: 75
llm_configurations:
  default:
    api_key: null  # null = OLLAMA_API_KEY from .env (config.py)
    model: mixtral:8x22b-instruct
    url: https://chat.binghamton.edu/api/chat/completions
quick_test:
  enabled: true
  grids:
  - medium
  max_steps: 200
  runs_per_config: 5
  scenarios:
  - baseline
  - race_white_black
scenarios:
- baseline
- race_white_black
- ethnic_asian_hispanic
- income_high_low
- political_liberal_conservative
